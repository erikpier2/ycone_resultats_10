            if (!response.ok) {

                throw new Error(
                    "Le fichier 'donnees.csv' est introuvable."
                );
            }

            /* =================================================
                LECTURE WINDOWS-1252
              ================================================= */
            const buffer =
                await response.arrayBuffer();

            const decoder =
                new TextDecoder('windows-1252');

            const textData =
                decoder.decode(buffer);

            const lines =
                textData.split(/\r?\n/);

            if (lines.length === 0) {

                throw new Error(
                    "Le fichier CSV est vide."
                );
            }

            /* =================================================
                DÉTECTION DES COLONNES AVEC DONNÉES
              ================================================= */
            const colonnesAvecDonnees =
                new Set();

            lines.forEach(
                (line, rowIndex) => {

                    if (
                        line.trim() === "" ||
                        /^;+$/.test(line.trim())
                    ) {
                        return;
                    }

                    if (rowIndex >= 2) {

                        const cells =
                            line.split(';');

                        cells.forEach(
                            (cellValue, colIndex) => {

                                if (
                                    cellValue.trim() !== ""
                                ) {

                                    colonnesAvecDonnees
                                        .add(colIndex);
                                }
                            }
                        );
                    }
                }
            );


            /* =================================================
                TEST D'ACTIVITÉ D'UN GROUPE DE 5
              ================================================= */
            function estGroupeActif(
                indexDeDepart
            ) {

                for (let i = 0; i < 5; i++) {

                    if (
                        colonnesAvecDonnees.has(
                            indexDeDepart + i
                        )
                    ) {
                        return true;
                    }
                }
                return false;
            }

            /* =================================================
                CONSTRUCTION DU TABLEAU
              ================================================= */
            let htmlRaw =
                "<table><thead>";

            let isBodyOpen = false;

            /* =================================================
                COLONNES DE CHOIX
              ================================================= */
            const colonnesDeChoix = [
                4, 9, 14, 19, 24,
                29, 34, 39, 44,
                49, 54, 59, 64,
                69, 74, 79, 84,
                89, 94, 99
            ];

            /* =================================================
                LECTURE DES LIGNES
              ================================================= */
            lines.forEach(
                (line, rowIndex) => {

                    /* -----------------------------------------
                        IGNORE LES LIGNES VIDES
                      ----------------------------------------- */
                    if (
                        line.trim() === "" ||
                        /^;+$/.test(line.trim())
                    ) {

                        return;
                    }

                    const cells =
                        line.split(';');

                    /* -----------------------------------------
                        CLASSES DES LIGNES D'EN-TÊTE
                      ----------------------------------------- */
                    let rowClass = "";

                    if (rowIndex === 0) {

                        rowClass =
                            ' class="sticky-row-1"';

                    } else if (rowIndex === 1) {

                        rowClass =
                            ' class="sticky-row-2"';
                    }

                    /* -----------------------------------------
                        PASSAGE AU TBODY
                      ----------------------------------------- */
                    if (
                        rowIndex === 2 &&
                        !isBodyOpen
                    ) {

                        htmlRaw +=
                            "</thead><tbody>";

                        isBodyOpen = true;
                    }

                    htmlRaw +=
                        `<tr${rowClass}>`;

                    /* -----------------------------------------
                        INDEX VIRTUEL
                      ----------------------------------------- */
                    let colVirtualIndex = 0;

                    /* =================================================
                        TRAITEMENT DES CELLULES
                      ================================================= */
                    for (
                        let colIndex = 0;
                        colIndex < cells.length;
                        colIndex++
                    ) {

                        let cleanValue =
                            cells[colIndex].trim();

                        const cellTag =
                            rowIndex < 2
                                ? 'th'
                                : 'td';

                        /* =============================================
                            MASQUAGE AUTOMATIQUE DES GROUPES VIDES
                          ============================================= */
                        if (colIndex >= 3) {

                            const startGroupIdx =
                                3 +
                                Math.floor(
                                    (colIndex - 3) / 5
                                ) * 5;

                            if (
                                !estGroupeActif(
                                    startGroupIdx
                                )
                            ) {

                                continue;
                            }
                        }

                        /* =============================================
                            CLASSES DES COLONNES
                          ============================================= */
                        let cellClass = "";

                        if (colIndex === 0) {

                            cellClass = "col-1";

                        } else if (colIndex === 1) {

                            cellClass = "col-2";

                        } else if (colIndex === 2) {

                            cellClass = "col-3";

                        } else {

                            cellClass = "dynamic-col";
                        }

                        /* =============================================
                            CORRECTION DES TEMPS
                          ============================================= */
                        if (cleanValue.includes(':')) {

                            const timeParts =
                                cleanValue.split(':');

                            if (
                                timeParts.length === 3
                            ) {

                                const hours =
                                    timeParts[0].trim();

                                if (
                                    hours === '00' ||
                                    hours === '0' ||
                                    hours === ''
                                ) {

                                    cleanValue =
                                        `${timeParts[1]}:${timeParts[2]}`;
                                }
                            }
                        }

                        /* =============================================
                            COLORATION DES COLONNES DE CHOIX
                          ============================================= */
                        if (
                            colonnesDeChoix.includes(
                                colIndex
                            ) &&
                            rowIndex >= 2
                        ) {

                            cellClass +=
                                ' col-choix';
                        }

                        /* =============================================
                            CONTENU AVEC LIEN
                          ============================================= */
                        let displayContent =
                            cleanValue;

                        if (
                            liensPersonnalises[
                                cleanValue
                            ]
                        ) {

                            displayContent = `

                                <a
                                    href="${liensPersonnalises[cleanValue]}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    ${cleanValue}
                                </a>
                            `;

                        } else if (
                            cleanValue.startsWith(
                                'http://'
                            ) ||
                            cleanValue.startsWith(
                                'https://'
                            )
                        ) {

                            displayContent = `

                                <a
                                    href="${cleanValue}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    ${cleanValue}
                                </a>

                            `;
                        }

                        /* =============================================
                            FOND NEUTRE DES GROUPES VIDES SUR UNE LIGNE
                          ============================================= */
                        if (
                            rowIndex >= 2 &&
                            colIndex >= 3
                        ) {

                            const debutGroupe =
                                3 +
                                Math.floor(
                                    (colIndex - 3) / 5
                                ) * 5;

                            const finGroupe =
                                debutGroupe + 5;

                            const cellulesDuGroupe =
                                cells.slice(
                                    debutGroupe,
                                    finGroupe
                                );

                            const estGroupeEntierementVide =
                                cellulesDuGroupe.every(
                                    val =>
                                        val.trim() === ""
                                );

                            if (
                                estGroupeEntierementVide
                            ) {

                                cellClass +=
                                    ' groupe-vide';
                            }
                        }

                        /* =============================================
                            CORRECTION DES DATES EXCEL
                          ============================================= */
                        if (
                            cleanValue.includes('-') ||
                            (
                                cleanValue.includes('/') &&
                                cleanValue
                                    .split('/')
                                    .length === 3
                            )
                        ) {

                            const mois = {

                                "janv": "1",
                                "févr": "2",
                                "mars": "3",
                                "avr": "4",
                                "mai": "5",
                                "juin": "6",
                                "juil": "7",
                                "août": "8",
                                "sept": "9",
                                "oct": "10",
                                "nov": "11",
                                "déc": "12",

                                "sep": "9",
                                "feb": "2",
                                "apr": "4",
                                "aug": "8",
                                "dec": "12"
                            };

                            if (
                                cleanValue.includes('-')
                            ) {

                                const parts =
                                    cleanValue
                                        .toLowerCase()
                                        .replace('.', '')
                                        .split('-');

                                if (
                                    parts.length === 2 &&
                                    mois[parts[0]]
                                ) {

                                    cleanValue =
                                        `${mois[parts[0]]}/${parts[1]}`;
                                }

                            } else {

                                const parts =
                                    cleanValue.split('/');

                                const jour =
                                    parseInt(
                                        parts[0],
                                        10
                                    );

                                const moisNum =
                                    parseInt(
                                        parts[1],
                                        10
                                    );

                                if (
                                    moisNum === 12
                                ) {

                                    cleanValue =
                                        `${jour}/${moisNum}`;
                                }
                            }
                        }

                        /* =================================================
                            FUSIONS DE LA LIGNE 1
                          ================================================= */
                        let colspanAttr = "";

                        let skipCell = false;

                        if (rowIndex === 0) {

                            /* ---------------------------------------------
                                GROUPE FIXE DES 3 PREMIÈRES COLONNES
                              --------------------------------------------- */
                            if (colIndex === 0) {

                                colspanAttr =
                                    ' colspan="3"';

                            } else if (
                                colIndex === 1 ||
                                colIndex === 2
                            ) {

                                skipCell = true;
                            }

                            /* ---------------------------------------------
                                GROUPES DE 5 COLONNES
                              --------------------------------------------- */
                            else if (
                                colIndex >= 3
                            ) {

                                const positionDansLeBloc =
                                    (colIndex - 3) % 5;

                                if (
                                    positionDansLeBloc === 0
                                ) {

                                    /* ===============================
                                        FUSION DE 5 COLONNES
                                      =============================== */
                                    colspanAttr =
                                        ' colspan="5" ';

                                    /* ===============================
                                        NUMÉRO DU GROUPE
                                      =============================== */
                                    const numeroGroupe =
                                        Math.floor(
                                            (colIndex - 3) / 5
                                        ) + 1;

                                    const cleInfo =
                                        "groupe" +
                                        numeroGroupe;

                                    /* ===============================
                                        AJOUT DU BOUTON INFO
                                      =============================== */
                                    if (
                                        infosGroupes[
                                            cleInfo
                                        ]
                                    ) {

                                        displayContent += `

                                            <button
                                                type="button"
                                                class="info-btn"
                                                data-info="${cleInfo}"
                                                aria-label="Informations"
                                                title="Informations complémentaires"
                                            >
                                                ⓘ
                                            </button>

                                        `;
                                    }

                                } else {

                                    skipCell = true;
                                }
                            }
                        }

                        /* ---------------------------------------------
                            CELLULE IGNORÉE
                          --------------------------------------------- */
                        if (skipCell) {
                            continue;
                        }

                        /* ---------------------------------------------
                            CRÉATION DE LA CELLULE
                          --------------------------------------------- */
                        htmlRaw +=
                            `<${cellTag}
                                class="${cellClass}"
                                ${colspanAttr}>
                                ${displayContent}
                            </${cellTag}>`;

                    }

                    htmlRaw += "</tr>";

                }
            );

            /* =========================================================
                FIN DU TABLEAU
              ========================================================= */
            htmlRaw +=
                isBodyOpen
                    ? "</tbody></table>"
                    : "</thead></table>";

            /* =========================================================
                AFFICHAGE
              ========================================================= */
            const container =
                document.getElementById(
                    'excel-table-container'
                );

            container.innerHTML =
                htmlRaw;

            document.getElementById(
                'loading'
            ).style.display = 'none';

        } catch (error) {

            console.error(
                "Détails :",
                error
            );

            document.getElementById(
                'loading'
            ).innerText =
                "Erreur : " + error.message;
        }

    }

    /* =========================================================
        FENÊTRE D'INFORMATIONS
      ========================================================= */
    const infoModal =
        document.getElementById(
            'info-modal'
        );

    const infoModalTitle =
        document.getElementById(
            'info-modal-title'
        );

    const infoModalBody =
        document.getElementById(
            'info-modal-body'
        );

    /* =========================================================
        OUVERTURE
      ========================================================= */
    function ouvrirInfo(cleInfo) {

        const info =
            infosGroupes[cleInfo];

        if (!info) {

            return;
        }

        /* -----------------------------------------
            TITRE
          ----------------------------------------- */
        infoModalTitle.textContent =
            info.titre || "Informations";

        /* -----------------------------------------
            NETTOYAGE
          ----------------------------------------- */
        infoModalBody.innerHTML = "";

        /* -----------------------------------------
            TEXTES
          ----------------------------------------- */
        if (
            Array.isArray(info.textes)
        ) {

            info.textes.forEach(
                texte => {

                    const p =
                        document.createElement(
                            "p"
                        );

                    p.className =
                        "info-modal-text";

                    p.textContent =
                        texte;

                    infoModalBody.appendChild(
                        p
                    );

                }
            );
        }

        /* -----------------------------------------
            LIENS
          ----------------------------------------- */
        if (
            Array.isArray(info.liens) &&
            info.liens.length > 0
        ) {

            const blocLiens =
                document.createElement(
                    "div"
                );

            info.liens.forEach(
                lien => {

                    const p =
                        document.createElement(
                            "p"
                        );

                    const a =
                        document.createElement(
                            "a"
                        );

                    a.href =
                        lien.url;

                    a.target =
                        "_blank";

                    a.rel =
                        "noopener noreferrer";

                    a.textContent =
                        "→ " + lien.texte;

                    p.appendChild(a);

                    blocLiens.appendChild(p);

                }
            );

            infoModalBody.appendChild(
                blocLiens
            );
        }

        /* -----------------------------------------
            DATE DE MISE À JOUR
          ----------------------------------------- */
        if (info.maj) {

            const maj =
                document.createElement(
                    "p"
                );

            maj.style.fontSize =
                "11px";

            maj.style.opacity =
                "0.7";

            maj.style.marginTop =
                "15px";

            maj.textContent =
                "Mis à jour le " +
                info.maj;

            infoModalBody.appendChild(
                maj
            );
        }

        /* -----------------------------------------
            AFFICHAGE
          ----------------------------------------- */
        infoModal.style.display =
            "flex";
    }

    /* =========================================================
        FERMETURE
      ========================================================= */
    function fermerInfo() {

        infoModal.style.display =
            "none";
    }

    /* =========================================================
        CLIC SUR UN BOUTON ⓘ
      ========================================================= */
    document.addEventListener(
        "click",
        function(event) {

            const bouton =
                event.target.closest(
                    ".info-btn"
                );

            if (bouton) {

                const cleInfo =
                    bouton.dataset.info;

                ouvrirInfo(
                    cleInfo
                );
            }

        }
    );

    /* =========================================================
        BOUTON X
      ========================================================= */
    document
        .querySelector(
            ".info-modal-close"
        )
        .addEventListener(
            "click",
            fermerInfo
        );

    /* =========================================================
        BOUTON FERMER
      ========================================================= */
    document
        .getElementById(
            "info-modal-close-btn"
        )
        .addEventListener(
            "click",
            fermerInfo
        );

    /* =========================================================
        CLIC EN DEHORS DE LA FENÊTRE
      ========================================================= */
    infoModal.addEventListener(
        "click",
        function(event) {

            if (
                event.target === infoModal
            ) {

                fermerInfo();
            }

        }
    );

    /* =========================================================
        TOUCHE ÉCHAP
      ========================================================= */
    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {
        
                fermerInfo();
            }

        }
    );

    /* =========================================================
        LANCEMENT
      ========================================================= */
    window.onload =
        loadCsvTable;

    </script>
</div>
